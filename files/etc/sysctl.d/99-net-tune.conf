# R1 Plus 千兆转发修复（2026-11-01 在 24.10.6 / kernel 6.6.133 上实测确认）
#
# 现象：PC 侧下载长期卡在 ~500Mbps，路由器本机下载也只有 ~730Mbps。
#       实测 eth0(GMAC) RX 在 ~680kpps 时丢包 2.07%，
#       /proc/net/softnet_stat 中 cpu0 的 dropped 计数持续增长。
# 根因：netdev_max_backlog 默认 1000；eth0 只有单 RX 队列且 RPS 默认全部指向 CPU0，
#       高 PPS 下 backlog 队列溢出丢包，TCP 据此误判拥塞并降速。
# 效果：丢包 2.07% -> 0.000%，路由器本机多流下载 732 -> 792Mbps。
net.core.netdev_max_backlog = 30000
